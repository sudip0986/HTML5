<!DOCTYPE html>
<html lang="en">
<head>
   
</head>
<body>
    <form action="">
        <h2>Job Application</h2>
        <label for="name">Name :</label>
        <br>
         <input type="text" id="name" name="name">
         <br>
        <label for="Email">Email :</label>
        <br>
         <input type="email" id="Email" name="Email">
    
         <br>
        <label for="phone">Phone :</label>
        <br>
         <input type="tel" id="phone" name="phone">
         <br>

         <label for="f">Resume :</label>
         <br>
         <input type="file" id="f" name="F">
         <br>
         <br>
            <label for="counter">Experience (in years):</label>
            <br>
         <input type="number" name="counter" id="counter" min="0" max="5">

         <fieldset> 
            <legend>Fill your interest</legend>
            <input type="checkbox" id="html" name="checkbox1">
            <br>
            <label for="html">HTML5</label>
            <br>
            <input type="checkbox" id="CSS" name="checkbox2">
            <br>
            <label for="CSS">CSS</label>
            <br>
            <input type="checkbox" id="js" name="checkbox3">
            <br>
            <label for="js">JAVA SCRIPT</label>
            <br>
    
         </fieldset>

         <label for="Highestedu">Highest Education :</label>
         <br>
         <select name="education" id="Highestedu">
            <option value="ssc">SSC</option>
            <option value="Hsc">HSC</option>
            <option value="Degree">Degree</option>
         </select>

         <fieldset>
            <p>Availability :</p>
            <input type="radio" id="full" name="Availability">
            <br>
            <label for="full">full time</label>
            <br>
            <input type="radio" id="part" name="Availability">
            <br>
            <label for="part">parttime</label>
         </fieldset>
         <br>
         <label for="text">Additional Comment</label>
         <br>
         <textarea name="text" id="text"></textarea>
          <input type="submit" value="SUBMIT">
    </form>
</body>
</html>
